services:
  mariadb:
    image: docker.io/library/mariadb:11.4
    container_name: fiot-mariadb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-fiot_garage}
      MARIADB_USER: ${MARIADB_USER:-fiot_app}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change_me_root}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-change_me_fiot_app}
      TZ: ${TZ:-America/Bogota}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro,Z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$${MARIADB_ROOT_PASSWORD}\" --silent",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  nodered:
    build:
      context: ./nodered
      dockerfile: Dockerfile
    image: fiot-nodered:4.1.8-22
    container_name: fiot-nodered
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HARDWARE_DEVICE_ID: ${HARDWARE_DEVICE_ID:-ESP32-GARAGE-CO-001}
      SIM_DEVICE_ID: ${SIM_DEVICE_ID:-SIM-GARAGE-CO-001}
      TZ: ${TZ:-America/Bogota}
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-maqiatto.com}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-your_maqiatto_username}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-change_me_maqiatto}
      MQTT_TOPIC_BASE: ${MQTT_TOPIC_BASE:-your_maqiatto_username/fiot/garage}
      MQTT_COMMAND_TOPIC: ${MQTT_COMMAND_TOPIC:-your_maqiatto_username/fiot/garage/commands}
      MARIADB_HOST: ${MARIADB_HOST:-mariadb}
      MARIADB_PORT: ${MARIADB_PORT:-3306}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-fiot_garage}
      MARIADB_USER: ${MARIADB_USER:-fiot_app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-change_me_fiot_app}
      COMMANDS_ENABLED: ${COMMANDS_ENABLED:-true}
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:5173}
      NR_AUTO_IMPORT: ${NR_AUTO_IMPORT:-true}
      NR_FORCE_IMPORT: ${NR_FORCE_IMPORT:-false}
      DB_WAIT_ENABLED: ${DB_WAIT_ENABLED:-true}
      DB_WAIT_TIMEOUT_SEC: ${DB_WAIT_TIMEOUT_SEC:-30}
      DB_WAIT_INTERVAL_SEC: ${DB_WAIT_INTERVAL_SEC:-1}
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:-}
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-}
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data:U
    depends_on:
      - mariadb

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    image: fiot-dashboard:1.0.0
    container_name: fiot-dashboard
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:1880}
      VITE_API_BEARER_TOKEN: ${API_BEARER_TOKEN:-}
    ports:
      - "${DASHBOARD_PORT:-5173}:5173"
    depends_on:
      - nodered

volumes:
  mariadb_data:
  nodered_data:
